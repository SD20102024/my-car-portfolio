name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature-branch   # <-- your Azure branch
  pull_request:
    branches:
      - feature-branch

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      # Step 3: Install dependencies (including devDependencies)
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Build Vite app
      - name: Build app
        run: npm run build

      # Step 5: Deploy to Azure Static Web App
      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"           # <-- adjust if your frontend is in a subfolder
          api_location: ""            # <-- leave empty if no backend API
          output_location: "dist"     # <-- matches Vite's default build output
