name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature-branch   # <-- your branch selected in Azure
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature-branch

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'   # use your Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app with Vite
        run: npm run build

      - name: Upload artifacts for deployment
        uses: actions/upload-artifact@v3
        with:
          name: build_artifact
          path: |
            dist
          
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"           # your app folder
          api_location: ""            # leave empty if no API
          output_location: "dist"     # Vite default build output
